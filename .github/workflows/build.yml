name: Build ESP Ghost Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Unzip source if uploaded as zip
        run: |
          if [ -f ESP-Ghost-Client-source.zip ]; then
            unzip -q ESP-Ghost-Client-source.zip -d _src
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "microsoft"

      - name: Find project folder
        id: find
        run: |
          F=$(find . -name gradlew -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "gradlew NOT FOUND. Files in repo:"
            find . -maxdepth 3 -not -path './.git/*'
            exit 1
          fi
          DIR=$(dirname "$F")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare gradlew
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: ./gradlew build -x spotlessCheck --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: ESP-Ghost-Client
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
