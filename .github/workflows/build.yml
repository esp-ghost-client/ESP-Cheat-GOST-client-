name: Build ESP Ghost Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "microsoft"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build -x spotlessCheck --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: ESP-Ghost-Client
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
