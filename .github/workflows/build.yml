
name: Build ESP Ghost Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Extract ZIP Source
        run: |
          if ! find . -name build.gradle -o -name build.gradle.kts | grep -q .; then
            Z=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
            if [ -n "$Z" ]; then
              mkdir -p src_unzipped
              unzip -o "$Z" -d src_unzipped
            fi
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Find Gradle Project
        run: |
          G=$(find . \( -name build.gradle -o -name build.gradle.kts \) -not -path './.git/*' | head -n 1)

          if [ -z "$G" ]; then
            echo "ERROR: build.gradle not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$G")" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ESP-Ghost-Client-Java21
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
