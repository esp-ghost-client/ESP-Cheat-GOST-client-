name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source if uploaded as zip
        run: |
          if [ ! -f build.gradle ]; then
            Z=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
            if [ -n "$Z" ]; then
              unzip -o "$Z" -d src_unzipped
            fi
          fi

      - name: Find project folder
        run: |
          G=$(find . -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$G" ]; then
            echo "build.gradle not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$G")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.0

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ESP-Ghost-Client
          path: ${{ env.PROJECT_DIR }}/build/libs/ESP-Ghost-Client-MC1.21.11-v1.0-*.jar
