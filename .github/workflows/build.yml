name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"
      - name: Build
        run: |
          Z=$(find . -name "Wurst7*.zip" | head -n1)
          echo "zip: $Z"
          mkdir out
          unzip -q "$Z" -d out
          cd out/*/
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: Wurst-jar
          path: out/**/build/libs/*.jar
