
name: Build ESP Ghost Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Find Project
        run: |
          G=$(find . -name build.gradle -o -name build.gradle.kts | grep -v '.gradle/' | head -n 1)

          if [ -z "$G" ]; then
            echo "ERROR: Gradle project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$G")" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build Client
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ESP-Ghost-Client-MC1.21.11-Java21
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
