name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: v1_21_4,  name: MC1.21.4 }
          - { dir: v1_21_8,  name: MC1.21.8 }
          - { dir: v1_21_11, name: MC1.21.11 }
          - { dir: v26_3,    name: MC26.3 }
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source if it was uploaded as a zip
        run: |
          if ! find . -path "*/${{ matrix.dir }}/build.gradle" -not -path './.git/*' | grep -q .; then
            Z=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
            if [ -n "$Z" ]; then
              unzip -o "$Z" -d src_unzipped
            fi
          fi

      - name: Find project folder
        run: |
          G=$(find . -path "*/${{ matrix.dir }}/build.gradle" -not -path './.git/*' | head -n 1)
          if [ -z "$G" ]; then
            echo "project folder ${{ matrix.dir }} not found"
            ls -R . | head -60
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$G")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.0

      - name: Build menu addon
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Merge menu into the ESP jar and pack with Fabric API
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ADDON=$(ls build/libs/*.jar | grep -v -E 'sources|dev' | head -n 1)
          echo "addon jar: $ADDON"
          rm -rf merged final pack && mkdir merged final pack
          cd merged
          unzip -q ../libs/esp-ghost-client.jar
          unzip -q -o "../$ADDON" 'bloodystar/*'
          python3 - <<'PY'
          import json
          d = json.load(open('fabric.mod.json'))
          d.setdefault('entrypoints', {})['client'] = ['bloodystar.espmenu.EspMenuMod']
          json.dump(d, open('fabric.mod.json', 'w'), indent=2)
          PY
          zip -q -X -r "../pack/ESP-Ghost-Client-${{ matrix.name }}-v1.0.jar" .
          cd ..
          cp fabric/*.jar pack/
          cd pack
          zip -q -X "../final/ESP-Ghost-Client-${{ matrix.name }}.zip" *.jar
          unzip -l "../final/ESP-Ghost-Client-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.name }}
          path: ${{ env.PROJECT_DIR }}/final/*.zip

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: zip-*
          merge-multiple: true

      - name: Publish public release (fixed tag "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release delete latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create latest dist/*.zip --repo "${{ github.repository }}" --title "ESP Ghost Client - latest" --notes "Each zip has the client jar + the matching Fabric API jar. Put both jars in your mods folder." --latest
